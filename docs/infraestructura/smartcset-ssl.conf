# ============================================================================
# COPIA DE REFERENCIA — NO es leída por Apache desde aquí.
#
# Original en producción: /etc/apache2/sites-available/smartcset-ssl.conf
# Servidor: 10.5.213.103 (usuario adsocset)
# Generado/instalado: 2026-06-17 — cierre de E1-A02 (HTTPS forzado)
# Habilitado con: sudo a2ensite smartcset-ssl && sudo systemctl restart apache2
#
# Si el servidor se reinstala o migra, copiar este contenido a
# /etc/apache2/sites-available/smartcset-ssl.conf y luego:
#   sudo a2enmod ssl
#   sudo a2ensite smartcset-ssl
#   sudo systemctl restart apache2
#
# El certificado referenciado (smartcset.crt / smartcset.key) se regenera
# con generar_certificado_smartcset.sh (raíz del repo) — no se versiona
# aquí porque incluye la clave privada.
#
# Detalle completo: "Documentacion para implementacion de MSPI/
# FASE 01_Blindaje Técnico Inmediato/
# REPORTE_E1-A02_CRYPTOGRAPHIC_FAILURES_SMARTCSET.md" v3.0
# ============================================================================

<VirtualHost *:443>
    ServerName 10.5.213.103
    ServerAdmin admin@smartcset.local
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/smartcset.crt
    SSLCertificateKeyFile /etc/apache2/certs/smartcset.key

    SSLProtocol TLSv1.2 TLSv1.3
    SSLCipherSuite "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305"
    SSLHonorCipherOrder on

    Header set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header set X-Content-Type-Options "nosniff"
    Header set X-Frame-Options "DENY"

    ErrorLog ${APACHE_LOG_DIR}/smartcset-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/smartcset-ssl-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName 10.5.213.103
    Redirect permanent / https://10.5.213.103/
</VirtualHost>
