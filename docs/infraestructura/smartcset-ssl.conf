# ============================================================================
# COPIA DE REFERENCIA — Apache producción SmartCSET (arquitectura en capas)
#
# Instalar en: /etc/apache2/sites-available/smartcset-ssl.conf
# Habilitar: sudo a2enmod ssl rewrite headers && sudo a2ensite smartcset-ssl
#            sudo systemctl restart apache2
#
# Ruta de despliegue ejemplo: /var/www/html/smartcset (URL https://IP/smartcset/)
# ============================================================================

# --- Opción A: app en la raíz del VirtualHost ---
# DocumentRoot /var/www/html/smartcset/frontend/web/public
# APP_BASE_PATH vacío en .env

# --- Opción B: app bajo /smartcset (recomendado en servidor compartido) ---
# DocumentRoot puede seguir siendo /var/www/html; usar Alias:
# Alias /smartcset /var/www/html/smartcset/frontend/web/public
# <Directory /var/www/html/smartcset/frontend/web/public>
#     Options FollowSymLinks
#     AllowOverride All
#     Require all granted
# </Directory>
# En .env: APP_BASE_PATH=smartcset

<VirtualHost *:443>
    ServerName 10.5.213.103
    ServerAdmin admin@smartcset.local

    # Document root = carpeta public del frontend (opción A)
    DocumentRoot /var/www/html/smartcset/frontend/web/public

    <Directory /var/www/html/smartcset/frontend/web/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Symlink public/routers → backend/routers (recomendado).
    # Alternativa si no hay symlink:
    # Alias /routers /var/www/smartcset/backend/routers
    # <Directory /var/www/smartcset/backend/routers>
    #     Require all granted
    # </Directory>

    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/smartcset.crt
    SSLCertificateKeyFile /etc/apache2/certs/smartcset.key

    SSLProtocol TLSv1.2 TLSv1.3
    SSLCipherSuite "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305"
    SSLHonorCipherOrder on

    Header set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header set X-Content-Type-Options "nosniff"
    Header set X-Frame-Options "DENY"

    ErrorLog ${APACHE_LOG_DIR}/smartcset-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/smartcset-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName 10.5.213.103
    Redirect permanent / https://10.5.213.103/
</VirtualHost>
