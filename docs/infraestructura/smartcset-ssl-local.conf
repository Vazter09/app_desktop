# ============================================================================
# VirtualHost Apache — SmartCSET LOCAL (simulación idéntica de producción)
#
# Instalar: sudo cp docs/infraestructura/smartcset-ssl-local.conf \
#                    /etc/apache2/sites-available/smartcset-ssl-local.conf
# Habilitar: sudo a2enmod ssl rewrite headers
#            sudo a2ensite smartcset-ssl-local
#            sudo systemctl restart apache2
#
# Requiere: certificado en /etc/apache2/certs/ (generar_certificado_smartcset.sh)
#           APP_ENV=production en .env
#           APP_BASE_PATH=smartcset en .env
# ============================================================================

<VirtualHost *:443>
    ServerName localhost

    DocumentRoot /var/www/html

    Alias /smartcset /home/ander/smartcset/frontend/web/public

    <Directory /home/ander/smartcset/frontend/web/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Redirigir raíz a /smartcset
    RedirectMatch permanent ^/$ /smartcset/

    SSLEngine on
    SSLCertificateFile    /etc/apache2/certs/smartcset.crt
    SSLCertificateKeyFile /etc/apache2/certs/smartcset.key

    SSLProtocol TLSv1.2 TLSv1.3
    SSLCipherSuite "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305"
    SSLHonorCipherOrder on

    Header set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header set X-Content-Type-Options "nosniff"
    Header set X-Frame-Options "DENY"

    ErrorLog  ${APACHE_LOG_DIR}/smartcset-local-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/smartcset-local-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName localhost
    Redirect permanent / https://localhost/smartcset/
</VirtualHost>
